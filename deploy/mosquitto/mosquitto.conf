# Mosquitto of the spots server (F24), with mosquitto-go-auth calling the
# server's /mqtt/* endpoints: only HamQSO users (Supabase token as password)
# read spots/#, only the "ingestor" account writes.
per_listener_settings false
allow_anonymous false

# Server → broker, Docker network only.
listener 1883
protocol mqtt

# Apps: MQTT over WebSocket, TLS done by Coolify/Traefik on spot.hamqso.app.
listener 9001
protocol websockets

# Nothing to keep: only news, no retained messages (the starting list is GET /v1/spots).
persistence false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host server
auth_opt_http_port 8081
auth_opt_http_getuser_uri /mqtt/user
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
auth_opt_cache true
auth_opt_auth_cache_seconds 60
auth_opt_acl_cache_seconds 300
